<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">

<th:block th:fragment="content">

    <section class="error-wrapper">
        <div class="container">
            <div class="error-card">
                <div class="error-code">4xx</div>
                <h1 class="error-title">서비스 이용 중 오류가 발생했어요</h1>
                <p class="error-message">
                    일시적인 문제로 요청을 처리하지 못했습니다.<br>
                    잠시 후 다시 시도해 주세요. 문제가 계속되면 관리자에게 문의해 주세요.
                </p>

                <div class="error-actions">
                    <a th:href="@{/}" class="btn-primary error-btn-main">홈으로 돌아가기</a>
                    <button type="button" class="btn-outline error-btn-sub"
                            onclick="location.reload()">
                        다시 시도
                    </button>
                </div>

                <p class="error-detail" th:if="${traceId != null}">
                    오류 추적 ID: <span th:text="${traceId}">abc12345</span>
                </p>
            </div>
        </div>
    </section>

</th:block>
</html>
