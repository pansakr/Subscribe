<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">

<th:block th:fragment="content">

    <style>
        /* 상단 헤더 / 하단 푸터 제거 */
        header,
        footer {
            display: none !important;
        }

        /* 전체 배경 단색 통일 */
        html, body {
            background: #050b1c !important;
        }

        /* 로그인 영역만 화면 중앙 */
        main {
            padding-top: 0 !important;
        }

        /* 로그인 카드 바깥 배경 글로우 제거 */
        .auth-wrapper {
            background: transparent !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 혹시 index.css에서 만든 글로우 제거 */
        body::before,
        body::after {
            content: none !important;
        }

        /* divider(구분선) 제거 */
        .divider {
            display: none !important;
        }
    </style>

    <section class="auth-wrapper">
        <div class="container">
            <div class="auth-card">

                <h1 class="auth-title">회원가입</h1>
                <p class="auth-subtitle">
                    사용 중인 구독 서비스를 등록하고,<br>
                    이번 달 구독료와 자동 결제일을 한눈에 확인해 보세요.
                </p>

                <form th:action="@{/users}" th:object="${userRequest}" method="post">
                    <div class="form-row">

                        <label for="email">이메일</label>

                        <div class="field-with-button">

                            <input type="email" id="email" th:field="*{email}" placeholder="example@domain.com" required>

                            <button type="button" class="btn-secondary"
                                    id="btn-email-check">중복확인
                            </button>
                        </div>

                        <div th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}" class="field-error">
                        </div>

                        <div id="email-check-message" class="field-hint"></div>
                    </div>

                    <div class="form-row">

                        <label for="password">비밀번호</label>
                        <input type="password" id="password" th:field="*{password}" placeholder="영문, 숫자를 포함해서 입력해 주세요" required>

                        <div th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}" class="field-error">
                        </div>
                    </div>

                    <div class="form-row">

                        <label for="name">이름</label>
                        <input type="text" id="name" th:field="*{name}" placeholder="이름을 입력해 주세요" required>

                        <div th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}" class="field-error">
                        </div>
                    </div>

                    <div class="form-row">

                        <label for="address">주소</label>
                        <input type="text" id="address" th:field="*{address}" placeholder="주소를 입력해 주세요" required>

                        <div th:if="${#fields.hasErrors('address')}"
                             th:errors="*{address}" class="field-error">
                        </div>
                    </div>

                    <div class="form-row">

                        <label for="phone">휴대폰 번호</label>
                        <input type="tel" id="phone" th:field="*{phone}" placeholder="- 을 제외하고 입력해 주세요" required>

                        <div th:if="${#fields.hasErrors('phone')}"
                             th:errors="*{phone}" class="field-error">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary btn-full">
                        회원가입 완료
                    </button>

                    <p class="auth-footnote">
                        이미 가입하셨나요?
                        <a th:href="@{/login}">로그인 하러가기</a>
                    </p>
                </form>

            </div>
        </div>
    </section>

</th:block>
</html>
