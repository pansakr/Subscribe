server:
  port: 8081

spring:
  # Database
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/subscribe
    username: csadmin
    password: 123$

  # JPA
  jpa:
    database: postgresql
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: none

    show-sql: false
    generate-ddl: false
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET} # 로컬 환경과 JWT 키 분리
    access-minutes: 30

logging:
  file:
    path: /var/log/subscribe